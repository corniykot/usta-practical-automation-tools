<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111418">
  <title>Thank you — USTA Scripts</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI",Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111418;color:#f4f3ef;padding:24px}
    main{width:min(100%,580px);text-align:center;padding:62px 28px;border:1px solid #30343a;border-radius:22px;background:radial-gradient(ellipse at top,#232a2a 0%,#171b1e 65%);box-shadow:0 24px 80px #0004}
    .mark{display:inline-grid;place-items:center;width:76px;height:76px;border:1px solid #7c9f94;border-radius:50%;color:#bddacc;font-size:34px;margin-bottom:26px}
    .eyebrow{font-size:12px;letter-spacing:.23em;text-transform:uppercase;color:#a4b8b0;font-weight:700}
    h1{font-size:clamp(38px,8vw,62px);letter-spacing:-.055em;line-height:1.04;margin:18px 0 20px}
    p{font-size:18px;line-height:1.65;color:#c7c9c8;margin:0 auto;max-width:420px}
    .note{margin-top:24px;font-size:14px;color:#8d9694}
    a{display:inline-block;margin-top:36px;color:#e9f2ec;text-decoration:none;border-bottom:1px solid #739b8d;padding-bottom:5px}
    a:focus-visible{outline:2px solid #bddacc;outline-offset:6px}
    footer{margin-top:60px;color:#8d9694;letter-spacing:.16em;font-size:11px;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">♥</div>
    <div class="eyebrow">A note from USTA Scripts</div>
    <h1>Thank you.</h1>
    <p>Your support means a lot. Every little contribution helps keep these practical tools free and gives us more time to make the next one.</p>
    <div class="note">Less repetitive work. More time for what matters.</div>
    <a href="https://github.com/corniykot/usta-practical-automation-tools">Explore USTA tools ↗</a>
    <footer>USTA SCRIPTS</footer>
  </main>
</body>
</html>

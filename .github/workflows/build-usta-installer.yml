name: Build USTA Smart Node Cleaner installer

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-usta-installer.yml"
      - "coreldraw/smart-node-cleaner/installer/**"
      - "coreldraw/smart-node-cleaner/UstaSmartNodeCleaner.gms"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile unsigned installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            $compiler = "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
          }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found" }
          & $compiler "coreldraw\smart-node-cleaner\installer\USTA-Smart-Node-Cleaner.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned setup for testing
        uses: actions/upload-artifact@v4
        with:
          name: USTA-Smart-Node-Cleaner-v0.73-unsigned
          path: coreldraw/smart-node-cleaner/installer/output/*.exe
          if-no-files-found: error
          retention-days: 30

# SignPath submission is intentionally not enabled before the Foundation
# approves the project and issues a signing policy and API token.
